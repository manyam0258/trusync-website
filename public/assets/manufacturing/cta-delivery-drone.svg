<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky Background -->
  <rect width="600" height="400" fill="#f8fafc"/>
  
  <!-- Drone Body -->
  <g transform="translate(300, 200)">
    <!-- Main Body -->
    <rect x="-40" y="-15" width="80" height="30" rx="5" fill="#1e293b"/>
    <rect x="-20" y="-20" width="40" height="10" rx="2" fill="#334155"/> <!-- Top Module -->
    
    <!-- Arms -->
    <path d="M-40 0 L-100 -20 M-40 0 L-100 20 M40 0 L100 -20 M40 0 L100 20" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Motors -->
    <circle cx="-100" cy="-20" r="8" fill="#0f172a"/>
    <circle cx="-100" cy="20" r="8" fill="#0f172a"/>
    <circle cx="100" cy="-20" r="8" fill="#0f172a"/>
    <circle cx="100" cy="20" r="8" fill="#0f172a"/>
    
    <!-- Propellers (Blurred) -->
    <ellipse cx="-100" cy="-20" rx="30" ry="2" fill="#cbd5e1" fill-opacity="0.5"/>
    <ellipse cx="-100" cy="20" rx="30" ry="2" fill="#cbd5e1" fill-opacity="0.5"/>
    <ellipse cx="100" cy="-20" rx="30" ry="2" fill="#cbd5e1" fill-opacity="0.5"/>
    <ellipse cx="100" cy="20" rx="30" ry="2" fill="#cbd5e1" fill-opacity="0.5"/>
    
    <!-- Payload (Box) -->
    <g transform="translate(0, 30)">
      <rect x="-25" y="0" width="50" height="30" fill="#d97706"/> <!-- Box Face -->
      <rect x="-25" y="0" width="50" height="10" fill="#f59e0b"/> <!-- Box Top -->
      <path d="M-25 0 L-35 -10 H15 L25 0 Z" fill="#b45309"/> <!-- Side (Perspective trick) -->
      
      <!-- Box Label -->
      <rect x="-15" y="10" width="30" height="10" fill="white" fill-opacity="0.8"/>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="8" fill="#1e293b">ERP</text>
    </g>
    
    <!-- Landing Gear -->
    <path d="M-20 15 L-25 30 H-15 M20 15 L25 30 H15" stroke="#1e293b" stroke-width="2"/>
  </g>
  
  <!-- Motion Lines -->
  <path d="M100 200 H200" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="20 10"/>
  <path d="M120 250 H220" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="15 15"/>
</svg>
