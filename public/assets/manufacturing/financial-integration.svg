<svg width="600" height="300" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Blueprint Background -->
  <rect width="600" height="300" fill="#1e3a8a"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="white" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="600" height="300" fill="url(#grid)" />

  <!-- T-Account Card -->
  <rect x="350" y="50" width="220" height="200" rx="4" fill="white" stroke="#93c5fd" stroke-width="4"/>
  <line x1="370" y1="80" x2="550" y2="80" stroke="#1e293b" stroke-width="2"/>
  <line x1="460" y1="80" x2="460" y2="230" stroke="#1e293b" stroke-width="2"/>
  
  <text x="390" y="70" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">DEBIT</text>
  <text x="490" y="70" font-family="monospace" font-size="14" font-weight="bold" fill="#1e293b">CREDIT</text>
  
  <text x="380" y="110" font-family="sans-serif" font-size="12" fill="#1e293b">Cost of</text>
  <text x="380" y="125" font-family="sans-serif" font-size="12" fill="#1e293b">Goods Sold</text>
  
  <text x="490" y="140" font-family="sans-serif" font-size="12" fill="#1e293b">Asset</text>
  <text x="490" y="155" font-family="sans-serif" font-size="12" fill="#1e293b">Inventory</text>
  
  <!-- Arrow Logic -->
  <path d="M 450 115 L 475 145" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Warehouse/Drone Scene -->
  <rect x="50" y="80" width="120" height="150" fill="#e2e8f0" stroke="#cbd5e1"/>
  <rect x="70" y="130" width="80" height="100" fill="#94a3b8"/> <!-- Door -->
  <path d="M50 80 L110 50 L170 80" fill="#cbd5e1" stroke="#94a3b8"/> <!-- Roof -->
  
  <!-- Drone Icon -->
  <g transform="translate(100, 160)">
    <circle cx="0" cy="0" r="15" fill="#3b82f6"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Connection Arrow -->
  <path d="M 180 150 L 330 150" stroke="#60a5fa" stroke-width="4" stroke-dasharray="10 5" marker-end="url(#arrowBig)"/>
  
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
    </marker>
    <marker id="arrowBig" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa" />
    </marker>
  </defs>
</svg>
