<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#grid)" />

  <!-- Factory Node (Left) -->
  <g transform="translate(150, 200)">
    <rect x="-80" y="-60" width="160" height="120" rx="8" fill="white" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-80" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#334155" font-size="14">YOUR FACTORY</text>
    
    <!-- Factory Icon -->
    <path d="M-40 20 V-20 L-10 -40 L20 -20 V20 H-40 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="15" height="20" fill="#cbd5e1"/>
    <path d="M20 0 V-30 H30 V0" stroke="#64748b" stroke-width="2"/>
    <path d="M30 -30 Q40 -40 50 -35" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Vendor Node (Right) -->
  <g transform="translate(650, 200)">
    <rect x="-80" y="-60" width="160" height="120" rx="8" fill="white" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-80" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#334155" font-size="14">SUBCONTRACTOR</text>
    
    <!-- Vendor Icon -->
    <path d="M-30 20 H30 V-10 L0 -30 L-30 -10 V20 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="-10" y="0" width="20" height="20" fill="#fde68a"/>
  </g>

  <!-- Flow Arrows (Top: Material Out) -->
  <path d="M230 160 C350 100 450 100 570 160" stroke="#3b82f6" stroke-width="4" fill="none" stroke-dasharray="10 5" marker-end="url(#arrowBlue)"/>
  <rect x="350" y="90" width="100" height="30" rx="15" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="400" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1e40af">Raw Materials</text>

  <!-- Flow Arrows (Bottom: Product In) -->
  <path d="M570 240 C450 300 350 300 230 240" stroke="#10b981" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="340" y="280" width="120" height="30" rx="15" fill="#ecfdf5" stroke="#10b981"/>
  <text x="400" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#065f46">Finished Item</text>

  <!-- Markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L10 3 L0 6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L10 3 L0 6 Z" fill="#10b981"/>
    </marker>
  </defs>

</svg>
