<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Tablet Frame -->
  <rect x="20" y="20" width="560" height="360" rx="24" fill="#1e293b"/>
  <rect x="40" y="40" width="520" height="320" rx="4" fill="#0f172a"/>
  
  <!-- Grid layout -->
  <!-- Chart 1: Production Volume (Line) -->
  <rect x="50" y="50" width="400" height="150" rx="4" fill="#1e293b"/>
  <text x="60" y="70" font-family="sans-serif" font-size="10" fill="#cbd5e1">Production Volume</text>
  <polyline points="60,180 120,160 180,160 240,120 300,130 360,90 420,80" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <area points="60,180 120,160 180,160 240,120 300,130 360,90 420,80 420,200 60,200" fill="#3b82f6" fill-opacity="0.2"/>

  <!-- Chart 2: Downtime (Bar) -->
  <rect x="50" y="210" width="190" height="140" rx="4" fill="#1e293b"/>
  <text x="60" y="230" font-family="sans-serif" font-size="10" fill="#cbd5e1">Downtime by Machine</text>
  <rect x="60" y="250" width="100" height="15" fill="#3b82f6"/>
  <rect x="60" y="275" width="60" height="15" fill="#64748b"/>
  <rect x="60" y="300" width="40" height="15" fill="#64748b"/>

  <!-- Chart 3: Scrap (Donut) -->
  <rect x="250" y="210" width="200" height="140" rx="4" fill="#1e293b"/>
  <text x="260" y="230" font-family="sans-serif" font-size="10" fill="#cbd5e1">Scrap Analysis</text>
  <circle cx="350" cy="280" r="40" stroke="#3b82f6" stroke-width="15"/>
  <circle cx="350" cy="280" r="40" stroke="#94a3b8" stroke-width="15" stroke-dasharray="60 190"/>
</svg>
