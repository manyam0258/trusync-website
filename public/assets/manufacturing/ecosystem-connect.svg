<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Central Hub -->
  <g transform="translate(400, 200)">
    <circle r="70" fill="white" stroke="#0f172a" stroke-width="4"/>
    <circle r="60" fill="#f1f5f9"/>
    
    <!-- Gear Icon -->
    <path d="M-20 -35 L20 -35 L25 -20 L40 -12 L50 -25 L70 0 L50 25 L40 12 L25 20 L20 35 L-20 35 L-25 20 L-40 12 L-50 25 L-70 0 L-50 -25 L-40 -12 L-25 -20 Z" fill="#334155"/>
    <circle r="15" fill="#f1f5f9"/>
    
    <text x="0" y="95" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="16" fill="#0f172a">MANUFACTURING</text>
  </g>

  <!-- HR Node (Top Left) -->
  <g transform="translate(150, 100)">
    <circle r="40" fill="white" stroke="#3b82f6" stroke-width="3"/>
    <path d="M-15 15 Q0 25 15 15 V5 H-15 Z" fill="#60a5fa"/>
    <circle cy="-5" r="10" fill="#60a5fa"/>
    <text x="0" y="60" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e40af">HR & PAYROLL</text>
  </g>

  <!-- Asset Node (Bottom Left) -->
  <g transform="translate(150, 300)">
    <circle r="40" fill="white" stroke="#3b82f6" stroke-width="3"/>
    <path d="M-15 10 H15 L10 -10 H-10 Z" fill="#60a5fa"/>
    <rect x="-5" y="-20" width="10" height="20" fill="#60a5fa"/>
    <text x="0" y="60" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e40af">ASSET MANAGEMENT</text>
  </g>

  <!-- Support Node (Right) -->
  <g transform="translate(650, 200)">
    <circle r="40" fill="white" stroke="#3b82f6" stroke-width="3"/>
    <path d="M-15 5 Q0 -20 15 5 V10 H10 V5 H-10 V10 H-15 Z" fill="#60a5fa"/>
    <text x="0" y="60" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1e40af">HELPDESK</text>
  </g>

  <!-- Connectors -->
  <!-- HR to Hub -->
  <path d="M190 100 H250 L330 160" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="250" cy="100" r="6" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Asset to Hub -->
  <path d="M190 300 H250 L330 240" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="250" cy="300" r="6" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Hub to Support -->
  <path d="M470 200 H610" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="540" cy="200" r="6" fill="#3b82f6">
    <animate attributeName="cx" values="470;610" dur="2s" repeatCount="indefinite"/>
  </circle>

</svg>
